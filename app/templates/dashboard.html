<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Tableau de bord</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h2 {
            margin: 0;
            font-size: 20px;
        }

        .btn-logout {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-logout:hover {
            background-color: #c0392b;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .badge-status {
            display: inline-block;
            background-color: #d4edda;
            color: #155724;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        #userMessage {
            font-size: 18px;
            color: #333;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <header>
        <h2>Mon Application</h2>
        <button class="btn-logout" id="logoutBtn">Déconnexion</button>
    </header>

    <div class="container">
        <span class="badge-status">● Connecté</span>
        <p id="userMessage">Chargement des données privées...</p>
    </div>

    <script>
        const token = localStorage.getItem("access_token");

        // Si aucun token en mémoire, redirection immédiate vers le login
        if (!token) {
            window.location.href = "/login-page";
        }

        // Appel à la route /private avec le token JWT
        fetch("/private", {
            method: "GET",
            headers: {
                "Authorization": `Bearer ${token}`
            }
        })
        .then(async (response) => {
            if (!response.ok) {
                // Token invalide ou expiré
                localStorage.removeItem("access_token");
                window.location.href = "/login-page";
                return;
            }
            const data = await response.json();
            document.getElementById("userMessage").textContent = data.message;
        })
        .catch(() => {
            document.getElementById("userMessage").textContent = "Erreur de connexion au serveur.";
        });

        // Bouton de déconnexion
        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.removeItem("access_token");
            window.location.href = "/login-page";
        });
    </script>
</body>
</html>
